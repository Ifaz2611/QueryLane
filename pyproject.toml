[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "querylane"
version = "0.16.0"
description = "Cost-aware LLM query routing: zero-token specialists, local models, and cloud fallback."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Ifaz Md Zahin", email = "zahin26112004@gmail.com" },
]
keywords = [
    "llm",
    "query-routing",
    "cost-optimization",
    "zero-token",
    "onnx",
    "local-llm",
    "llama-cpp",
    "fireworks-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openai>=1.40,<3",
]

[project.urls]
Homepage = "https://github.com/Ifaz2611/QueryLane"
Repository = "https://github.com/Ifaz2611/QueryLane.git"
Issues = "https://github.com/Ifaz2611/QueryLane/issues"
Documentation = "https://github.com/Ifaz2611/QueryLane#readme"
Changelog = "https://github.com/Ifaz2611/QueryLane/blob/main/CHANGELOG.md"

[project.optional-dependencies]
local = ["llama-cpp-python"]
specialists = ["numpy", "onnxruntime", "tokenizers"]
dev = ["numpy", "pytest", "pytest-cov", "ruff", "pre-commit", "build", "twine"]
finetune = [
    "transformers>=4.45",
    "trl>=0.12",
    "peft>=0.13",
    "datasets",
    "accelerate",
    "sentencepiece",
]

[project.scripts]
querylane = "agent.main:main"
querylane-explain = "agent.explain:main"

[tool.setuptools]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
