# Install once with: pre-commit install
# Run manually with: pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: secret-scan
        name: secret scan
        entry: python scripts/check_secrets.py
        language: system
        types: [text]
        require_serial: true
